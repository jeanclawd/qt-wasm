name: screenshot

# Manual only. This box's browser is too old for JSPI and there is no disk to
# install a new one, so the screenshot of the live demo is taken on a runner
# with a current Chromium and downloaded as an artifact.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to screenshot
        default: https://jeanclawd.github.io/qt-wasm/
        required: true

permissions:
  contents: read

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install playwright + chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Chromium version
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              print("chromium", b.version)
              b.close()
          PY

      - name: Shoot
        run: python scripts/screenshot.py "${{ inputs.url }}" screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: error
